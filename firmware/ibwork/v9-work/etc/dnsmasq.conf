# ── tinyvless split-DNS (анти-DNS-отравление Yota) ──
# ISP (Yota) через DPI травит заблокированные домены на СВОЁМ резолвере (Instagram → 127.0.0.1).
# no-resolv = НЕ используем отравленный ISP-резолвер вообще.
no-resolv
# ★ dnsmasq был дважды OOM-killed под реальной многодоменной нагрузкой (RSS 8.8МБ на 58МБ-роутере,
# он единственный DNS для сети — его смерть = полный отказ резолва). НЕ ставить cache-size
# ВРУЧНУЮ здесь: UCI (/etc/config/dhcp option cachesize) уже генерирует cache-size в
# /var/etc/dnsmasq.conf.cfg... — ручной дубль → "illegal repeated keyword" → crash-loop.
# Кэш задаём через UCI: cachesize=300 (см. etc/uci-defaults/99-tinyvless-dnsmasq).
# ВАЖНО: высокий кэш (300) НЕ "более жадный к RAM" — он СНИЖАЕТ upstream-нагрузку при burst:
# меньше повторных запросов к 77.88.8.8 → меньше pending-forward entries → меньше RSS spike.
# dns-forward-max=50 — stability-v2: снижен с 100. YouTube генерирует десятки *.googlevideo.com
# DNS-запросов одновременно → пик pending-forward у dnsmasq → OOM (наблюдали RSS 8.2МБ).
dns-forward-max=50
# (filter-aaaa не поддержан этим dnsmasq-full → ронял dnsmasq; убрано. IPv6-WAN выключен,
#  поэтому AAAA-адреса у клиента и так быстро фейлятся с падением на IPv4 — не критично.)

# RU-TLD всегда через быстрый резолвер (независимо от DOH_MODE — .ru/.su/.рф не травятся).
server=/ru/77.88.8.8
server=/su/77.88.8.8
server=/xn--p1ai/77.88.8.8

# Секции tinyvless-resolvers / tinyvless-nftset / tinyvless-doh
# генерируются автоматически скриптом /etc/tinyvless/domains.sh — не редактировать вручную.
