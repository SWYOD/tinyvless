<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tinyvless — микротюнинг</title>
<style>
:root{ --txt:#e6edf3; }
*{ box-sizing:border-box; }
body{ margin:0; background:#0d1117; color:var(--txt); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:14px 16px; }
.tv-loading{ min-height:calc(100vh - 28px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; color:#8b949e; text-align:center; padding:24px; }
.tv-loading-brand{ color:#3fb950; animation:tvpulse 1.7s ease-in-out infinite; }
.tv-loading-brand svg{ display:block; }
.tv-loading-text{ margin:0; font-size:15px; letter-spacing:.02em; }
@keyframes tvpulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.1); opacity:.8; } }
</style>
</head>
<body>
<div id="app">
	<div class="tv-loading">
		<div class="tv-loading-brand">
			<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></svg>
		</div>
		<p class="tv-loading-text">Загрузка микротюнинга…</p>
	</div>
</div>
<script>
var CGI = '/cgi-bin/tv';
var FMAP = {
	'/etc/tinyvless/microtun.conf': 'microtun',
	'/etc/tinyvless/microtun.defaults': 'microtun_defaults',
	'/etc/tinyvless/udp_tunnel_domains.list': 'udp_tunnel',
	'/etc/tinyvless/card_order.json': 'card_order',
	'/etc/tinyvless/speedtest_sources.json': 'speedtest_sources',
	'/etc/tinyvless/poll_interval.json': 'poll_interval'
};
function append(el, ch) {
	if (ch == null) return;
	if (Array.isArray(ch)) { ch.forEach(function (c) { append(el, c); }); return; }
	if (ch instanceof Node) el.appendChild(ch); else el.appendChild(document.createTextNode(String(ch)));
}
function E(tag, attrs, children) {
	if (arguments.length === 2 && (Array.isArray(attrs) || attrs instanceof Node)) { children = attrs; attrs = {}; }
	attrs = attrs || {};
	if (tag === 'style') { var s = document.createElement('style'); s.textContent = children; return s; }
	var el = document.createElement(tag);
	for (var k in attrs) {
		if (attrs[k] == null) continue;
		if (k === 'class') el.className = attrs[k];
		else if (k === 'click') el.addEventListener('click', attrs[k]);
		else el.setAttribute(k, attrs[k]);
	}
	append(el, children);
	return el;
}
var fs = {
	read: function (path) {
		var f = FMAP[path]; if (!f) return Promise.reject('bad path');
		return fetch(CGI + '?a=read&f=' + f, { cache: 'no-store' }).then(function (r) { return r.text(); });
	},
	write: function (path, data) {
		var f = FMAP[path]; if (!f) return Promise.reject('bad path');
		return fetch(CGI + '?a=write&f=' + f, { method: 'POST', body: data == null ? '' : String(data) }).then(function (r) { return r.json(); });
	},
	exec: function (path, args) {
		args = args || [];
		var q = 'a=exec&cmd=' + encodeURIComponent(args[0] || '');
		if (args[1] != null) q += '&arg=' + encodeURIComponent(args[1]);
		return fetch(CGI + '?' + q, { cache: 'no-store' }).then(function (r) { return r.text(); })
			.then(function (t) { return { stdout: t }; });
	}
};
var ui = { createHandlerFn: function (c, fn) { return fn; } };
var poll = { add: function () {} };
var view = { extend: function (o) { return o; } };
fetch('/luci-static/resources/view/tinyvless/microtun.js', { cache: 'no-store' })
	.then(function (r) { return r.text(); })
	.then(function (src) {
		var app = new Function('view', 'fs', 'ui', 'poll', 'E', src)(view, fs, ui, poll, E);
		return Promise.resolve(app.load()).then(function (data) {
			document.getElementById('app').innerHTML = '';
			document.getElementById('app').appendChild(app.render(data));
		});
	})
	.catch(function (e) {
		document.getElementById('app').innerHTML = '<div class="tv-loading"><div class="tv-loading-brand" style="color:#f85149;animation:none"><svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3"/></svg></div><p class="tv-loading-text">Ошибка загрузки: ' + e + '</p></div>';
	});
</script>
</body>
</html>
