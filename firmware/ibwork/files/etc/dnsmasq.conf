# ── tinyvless split-DNS (анти-DNS-отравление Yota) ──
# ISP (Yota) через DPI травит заблокированные домены на СВОЁМ резолвере (Instagram → 127.0.0.1).
# no-resolv = НЕ используем отравленный ISP-резолвер вообще.
no-resolv
# ★ dnsmasq был дважды OOM-killed под реальной многодоменной нагрузкой (RSS 8.8МБ на 58МБ-роутере,
# он единственный DNS для сети — его смерть = полный отказ резолва). НЕ ставить cache-size
# ВРУЧНУЮ здесь: UCI (/etc/config/dhcp option cachesize) уже генерирует cache-size в
# /var/etc/dnsmasq.conf.cfg... — ручной дубль → "illegal repeated keyword" → crash-loop.
# Границу кэша задаём через UCI (см. etc/uci-defaults/99-tinyvless-dnsmasq: cachesize=300).
# dns-forward-max НЕ управляется UCI на этой сборке (проверено) — можно ставить здесь напрямую,
# ограничивает число ОДНОВРЕМЕННЫХ форвардов upstream (защита от бэклога при burst-нагрузке).
dns-forward-max=100
# (filter-aaaa не поддержан этим dnsmasq-full → ронял dnsmasq; убрано. IPv6-WAN выключен,
#  поэтому AAAA-адреса у клиента и так быстро фейлятся с падением на IPv4 — не критично.)

